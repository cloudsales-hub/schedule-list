name: build-windows

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      - run: npm test
      - run: cargo test -p datafile
      # 설치 파일을 만들고 GitHub 릴리스(v<버전>)에 올린다. 앱은 이 릴리스의 latest.json으로 새 버전을 확인한다.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 일정 위젯 v__VERSION__
          releaseBody: 자동 빌드된 설치 파일입니다.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: ScheduleWidget-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
